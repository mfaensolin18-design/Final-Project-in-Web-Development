<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clinic One – Appointments and Records</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f1;--surface:#fff;--ink:#12312e;--muted:#5b716e;--line:#d3e0dd;--teal:#0f6b66;--teal-ink:#fff;--soft:#dcebe8;--warn:#c4472f;--ok:#2d7a4b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c1b;--surface:#172827;--ink:#e3efec;--muted:#93aaa6;--line:#2a4140;--teal:#4cc2b8;--teal-ink:#0a1a19;--soft:#1f3836;--warn:#ff8a73;--ok:#6fd39a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1c1b;--surface:#172827;--ink:#e3efec;--muted:#93aaa6;--line:#2a4140;--teal:#4cc2b8;--teal-ink:#0a1a19;--soft:#1f3836;--warn:#ff8a73;--ok:#6fd39a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif}
header{background:var(--teal);color:var(--teal-ink);padding:18px 20px 0}
.wrap{max-width:980px;margin:0 auto}
header h1{margin:0;font-size:1.5rem;letter-spacing:-.01em}
header p{margin:2px 0 14px;opacity:.85;font-size:.95rem}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{background:transparent;color:inherit;border:0;padding:10px 14px;font:inherit;font-weight:500;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap;opacity:.8}
nav button[aria-current=true]{background:var(--bg);color:var(--ink);opacity:1}
main{padding:22px 20px 60px}
h2{font-size:1.3rem;margin:0 0 14px}h3{font-size:1.05rem;margin:0 0 8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--surface);border-left:5px solid var(--teal);padding:12px 16px;border-radius:6px}
.stat b{display:block;font-size:1.9rem;line-height:1.1}.stat span{color:var(--muted);font-size:.9rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-of-type{border-top:0}
.time{font-weight:700;min-width:64px}
.grow{flex:1;min-width:160px}.sub{color:var(--muted);font-size:.88rem}
label{display:block;font-weight:500;font-size:.9rem;margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 14px}
button.b{background:var(--teal);color:var(--teal-ink);border:0;padding:10px 16px;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}
button.g{background:transparent;color:var(--ink);border:1px solid var(--line);padding:6px 10px;border-radius:8px;font:inherit;font-size:.85rem;cursor:pointer}
button.g.d{color:var(--warn)}
:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.slots{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.slot{padding:8px 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;cursor:pointer;font:inherit}
.slot[aria-pressed=true]{background:var(--teal);color:var(--teal-ink);border-color:var(--teal)}
.slot:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:700;background:var(--soft)}
.tag.Completed{color:var(--ok)}.tag.Cancelled{color:var(--warn)}
.tabs2{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs2 button[aria-pressed=true]{background:var(--soft);font-weight:700}
.msg{padding:10px 14px;border-radius:8px;background:var(--soft);margin-bottom:14px}
.err{color:var(--warn)}
.cols{display:grid;grid-template-columns:1fr 1.3fr;gap:18px}
@media(max-width:760px){.cols{grid-template-columns:1fr}}
.note{border-left:3px solid var(--teal);padding:4px 12px;margin:10px 0}
.sched{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sched span{padding:3px 10px;border-radius:6px;background:var(--soft);font-size:.85rem}
.sched span.off{opacity:.4}
.btn-theme{float:right;background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:4px 10px;font:inherit;font-size:.85rem;cursor:pointer}
@media(prefers-reduced-motion:no-preference){main>div{animation:in .25s ease-out}@keyframes in{from{opacity:0}to{opacity:1}}}
.printonly{display:none;margin-bottom:10px}
body.hasbg{background-size:cover;background-position:center;background-attachment:fixed}.bgprev{max-width:100%;max-height:160px;border-radius:8px;border:1px solid var(--line);margin-top:8px}
.brand{display:flex;gap:14px;align-items:center;margin-bottom:6px}.brand img{height:64px;width:auto;background:#fff;border-radius:10px;padding:4px}.brand p{margin-bottom:6px}
.duty{border-left:6px solid var(--ok)}.closed{border-left:6px solid var(--warn)}.tag.Pending{color:var(--warn)}.tag.Received{color:var(--ok)}.tag.Rejected{color:var(--warn)}
@media print{header,#nav,.noprint,.cols>div:first-child,.rec label,.rec select,.rec textarea,.rec .b{display:none!important}.cols{display:block}body{background:#fff;color:#000}.panel{border:0}.printonly{display:block!important}}
</style>
</head>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.toISOString().slice(0,10);
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return iso(d)};
const addDays=(n)=>{const d=new Date(today()+'T00:00');d.setDate(d.getDate()+n);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return iso(d)};
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const SLOTS=[];for(let h=9;h<17;h++){if(h===12)continue;SLOTS.push(h+':00'.replace(/^(\d):/,'0$1:'),(h+':30'))}
const pad=t=>t.padStart(5,'0');
const fmt=t=>{let[h,m]=t.split(':');h=+h;return(h>12?h-12:h)+':'+m+(h>=12?' PM':' AM')};
const fdate=d=>new Date(d+'T00:00').toLocaleDateString('en-PH',{weekday:'short',month:'short',day:'numeric',year:'numeric'});

function seed(){return{
 doctors:[{id:'d1',name:'Dr. Maria Santos',spec:'Family Medicine',days:[1,2,3,4,5]},{id:'d2',name:'Dr. Jose Reyes',spec:'Pediatrics',days:[1,3,5]},{id:'d3',name:'Dr. Ana Cruz',spec:'Internal Medicine',days:[2,4,6]}],
 patients:[{id:'p1',name:'Liza Mendoza',age:34,phone:'0917 555 0101',notes:[{date:addDays(-20),did:'d1',text:'Seasonal flu. Advised rest and fluids. Paracetamol every 6 hours as needed.'}]},
  {id:'p2',name:'Carlo Dela Peña',age:7,phone:'0918 555 0188',notes:[]},
  {id:'p3',name:'Rodel Bautista',age:58,phone:'0920 555 0144',notes:[{date:addDays(-45),did:'d3',text:'Blood pressure 150/95. Started monitoring. Follow-up in 4 weeks.'}]}],
 appts:[{id:'a1',pid:'p1',did:'d1',date:today(),time:'09:00',reason:'Follow-up check',status:'Scheduled'},
  {id:'a2',pid:'p2',did:'d2',date:today(),time:'10:30',reason:'Vaccination',status:'Scheduled'},
  {id:'a3',pid:'p3',did:'d3',date:addDays(2),time:'14:00',reason:'Blood pressure review',status:'Scheduled'}]}}
let S;try{S=JSON.parse(localStorage.getItem('clinic-v1'))}catch(e){}
if(!S||!S.appts)S=seed();
if(!S.doctors.some(d=>d.id==='d4'))S.doctors.push({id:'d4',name:'Midwife Rosa Villanueva',spec:'Maternal and Newborn Care',kind:'Midwife',days:[1,2,3,4,5]});
S.don=S.don||[];S.wd=S.wd||[];S.wpw=S.wpw||{};S.pay=S.pay||{GCash:{name:'Clinic One',num:'0900 000 0000'},Maya:{name:'Clinic One',num:'0900 000 0001'},'Online banking':{bank:'Sample Bank',name:'Clinic One',num:'0000 0000 0000'}};
const save=()=>{try{localStorage.setItem('clinic-v1',JSON.stringify(S))}catch(e){}};
const uid=p=>p+Math.random().toString(36).slice(2,8);

const D=id=>S.doctors.find(x=>x.id===id)||{name:'Unknown'};

 if(!S.wpw[user.u])return`<div class="panel"><h3>Withdraw donations</h3><p class="sub">Create a withdrawal password first. You will need it for every withdrawal.</p><div class="grid"><div><label for="wp1">Withdrawal password (at least 6 characters)</label><input id="wp1" type="password" autocomplete="new-password"></div><div><label for="wp2">Confirm password</label><input id="wp2" type="password" autocomplete="new-password"></div></div><p><button class="b" id="wpset">Create withdrawal password</button></p>${hist}</div>`;
 const z=wf||{t:'wallet',m:'GCash',a:'',n:'',num:''},isW=z.t==='wallet';if(!isW&&!BANKS.includes(z.m))z.m='BDO';if(isW&&!['GCash','Maya'].includes(z.m))z.m='GCash';
 return`<div class="panel"><h3>Withdraw donations</h3><p class="sub">Available balance: <b>${peso(avail())}</b>. This records the withdrawal and lowers the balance. You must send the money from the clinic's own account.</p><div class="grid"><div><label for="wt">Withdraw by</label><select id="wt"><option value="wallet" ${isW?'selected':''}>Online wallet</option><option value="bank" ${isW?'':'selected'}>Bank transfer</option></select></div><div><label for="${isW?'wm':'wb'}">${isW?'Wallet':'Bank'}</label><select id="${isW?'wm':'wb'}">${(isW?['GCash','Maya']:BANKS).map(x=>`<option ${z.m===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label for="wa">Amount (PHP)</label><input id="wa" type="number" min="1" step="0.01" value="${esc(z.a)}"></div><div><label for="wn">${isW?z.m+' name':'Account name'}</label><input id="wn" value="${esc(z.n)}"></div><div><label for="wnum">${isW?z.m+' number':'Bank account number'}</label><input id="wnum" inputmode="numeric" value="${esc(z.num)}"></div><div><label for="wp">Withdrawal password</label><input id="wp" type="password" autocomplete="off"></div></div><p><button class="b" id="wsend">Withdraw</button></p>${hist}</div>`}
$('#view').addEventListener('change',e=>{if(e.target.id!=='bgfile'||role()!=='staff')return;const f=e.target.files[0];if(!f)return;
 if(!f.type.startsWith('image/')){msg='<span class="err">Choose an image file (JPG, PNG or WebP).</span>';render();return}
 if(f.size>10*1024*1024){msg='<span class="err">That image is too large. Choose one under 10 MB.</span>';render();return}
 const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1600/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  const url=c.toDataURL('image/jpeg',.8),old=S.bg;S.bg=url;try{localStorage.setItem('clinic-v1',JSON.stringify(S));msg='Background updated. Everyone who opens the portal will see it.'}catch(err){S.bg=old;msg='<span class="err">The image could not be saved. Try a smaller image.</span>'}render()};
  im.onerror=()=>{msg='<span class="err">That file could not be read as an image.</span>';render()};im.src=r.result};r.readAsDataURL(f)});
$('#view').addEventListener('change',e=>{if(['wt','wm','wb'].includes(e.target.id)){const tv=$('#wt').value,m=($('#wm')||$('#wb')).value;wf={t:tv,m:e.target.id==='wt'?(tv==='wallet'?'GCash':'BDO'):m,a:$('#wa').value,n:$('#wn').value,num:$('#wnum').value};render()}});
$('#view').addEventListener('change',e=>{if(e.target.id==='dm'){dn={m:e.target.value,a:$('#da').value,r:$('#dr').value,d:$('#dd').value};render()}});
let rq=null,arr=null;
const onDuty=dt=>S.doctors.filter(d=>d.days.includes(new Date(dt+'T00:00').getDay()));
function reqView(){const z=rq||{n:user.name,a:'',g:'',r:''};return`<h2>Book an appointment</h2>${msg?`<div class="msg err" role="alert">${msg}</div>`:''}<div class="panel"><p class="sub">Tell us about yourself and why you are visiting. Clinic staff will confirm your appointment and choose the date and time based on the doctors on duty.</p><div class="grid"><div><label for="qn">Patient name</label><input id="qn" value="${esc(z.n)}" autocomplete="name"></div><div><label for="qa">Age</label><input id="qa" type="number" min="0" max="120" value="${esc(z.a)}"></div><div><label for="qg">Gender</label><select id="qg">${['','Female','Male','Other'].map(x=>`<option value="${x}" ${z.g===x?'selected':''}>${x||'Select…'}</option>`).join('')}</select></div></div><label for="qr">Reason for visit</label><textarea id="qr" rows="3">${esc(z.r)}</textarea><p><button class="b" id="rsend">Send request</button></p></div>`}
function arrView(){const a=S.appts.find(x=>arr&&x.id===arr.id&&x.status==='Pending');if(!a)return'<h2>Arrange appointment</h2><p class="sub">That request was already handled.</p>';
 const p=P(a.pid),ds=onDuty(arr.date);if(!ds.some(d=>d.id===arr.did))arr.did=ds[0]?ds[0].id:'';
 return`<h2>Arrange appointment</h2>${msg?`<div class="msg err" role="alert">${msg}</div>`:''}<div class="panel"><h3>${esc(p.name)}</h3><div class="sub">${p.age||'Age not given'} yrs · ${esc(p.gender||'Gender not given')}</div><p>Reason for visit: ${esc(a.reason||'Not given')}</p></div><div class="panel"><div class="grid"><div><label for="ad">Date</label><input type="date" id="ad" min="${today()}" value="${arr.date}"></div><div><label for="adoc">Doctor on duty</label>${ds.length?`<select id="adoc">${ds.map(d=>`<option value="${d.id}" ${d.id===arr.did?'selected':''}>${esc(d.name)} (${esc(d.spec)})</option>`).join('')}</select>`:'<p class="err">No doctors on duty on this day. Choose another date.</p>'}</div></div>${ds.length?`<label>Time</label><div class="slots">${SLOTS.map(pad).map(t=>`<button type="button" class="slot" data-aslot="${t}" aria-pressed="${arr.slot===t}" ${taken(arr.did,arr.date,t)?'disabled':''}>${fmt(t)}</button>`).join('')}</div>`:''}<p><button class="b" id="aok">Confirm appointment</button> <button class="g d" id="ano">Decline request</button></p></div>`}
const myPid=()=>{let p=S.patients.find(x=>x.acc===user.u);if(!p){p={id:uid('p'),name:user.name,age:0,phone:'',notes:[],acc:user.u};S.patients.push(p);save()}return p.id};
function mine(){const p=S.patients.find(x=>x.acc===user.u),l=p?S.appts.filter(a=>a.pid===p.id).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)):[];
 return`<h2>My appointments</h2>${msg?`<div class="msg" role="status">${msg}</div>`:''}<div class="panel">${l.map(a=>`<div class="row"><span class="time">${a.status==='Pending'?'Pending':fmt(a.time)}</span><div class="grow"><b>${a.did?esc(D(a.did).name):'Waiting for staff to confirm'}</b><div class="sub">${a.did?fdate(a.date)+' · ':'Staff will choose your date and time · '}${esc(a.reason||'No reason given')}</div></div><span class="tag ${a.status}">${a.status}</span>${a.status==='Scheduled'||a.status==='Pending'?`<button class="g d" data-act="cancel" data-id="${a.id}">Cancel</button>`:''}</div>`).join('')||'<p class="sub">You have no appointments yet. Use Book appointment to make one.</p>'}</div>`}
const v=$('#view');
v.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.dataset.arr){arr={id:t.dataset.arr,date:addDays(1),did:'',slot:''};tab='arr';msg='';render()}
 else if(t.dataset.aslot){arr.slot=t.dataset.aslot;render()}
 else if(t.id==='aok'){if(!arr.did||!arr.slot){msg='Choose a doctor on duty and a time slot.';render();return}
  if(taken(arr.did,arr.date,arr.slot)){msg='That slot was just taken. Choose another time.';arr.slot='';render();return}
  const a=S.appts.find(x=>x.id===arr.id);Object.assign(a,{did:arr.did,date:arr.date,time:arr.slot,status:'Scheduled'});save();
  msg='Confirmed: '+esc(P(a.pid).name)+' with '+esc(D(a.did).name)+' on '+fdate(a.date)+' at '+fmt(a.time)+'.';tab='appts';render()}
 else if(t.id==='ano'){const a=S.appts.find(x=>x.id===arr.id);a.status='Cancelled';save();msg='Request declined.';tab='appts';render()}
 else if(t.id==='bgrm'){delete S.bg;save();msg='Background removed.';render()}
 else if(t.id==='wpset'){const a=$('#wp1').value,b=$('#wp2').value;msg=a.length<6?'<span class="err">The withdrawal password must have at least 6 characters.</span>':a!==b?'<span class="err">The passwords do not match.</span>':'';
  if(msg){render();return}
  sha(a).then(h=>{S.wpw[user.u]=h;save();msg='Withdrawal password created. You can now make withdrawals.';render()})}
 else if(t.id==='wsend'){const f={t:$('#wt').value,m:($('#wm')||$('#wb')).value,a:$('#wa').value,n:$('#wn').value.trim(),num:$('#wnum').value.trim()},pw=$('#wp').value;wf=f;
  const amt=+f.a,digits=f.num.replace(/[\s-]/g,''),isW=f.t==='wallet';
  const bad=!(amt>0)?'Enter the amount to withdraw.':amt>avail()?'The amount is more than the available balance ('+peso(avail())+').':!f.n?(isW?'Enter the '+f.m+' name.':'Enter the account name.'):isW&&!/^09\d{9}$/.test(digits)?'Enter a valid '+f.m+' number (11 digits, starting with 09).':!isW&&!/^\d{8,20}$/.test(digits)?'Enter a valid bank account number (8 to 20 digits).':!pw?'Enter your withdrawal password.':'';
  if(bad){msg='<span class="err">'+bad+'</span>';render();return}
  sha(pw).then(h=>{if(h!==S.wpw[user.u]){msg='<span class="err">Wrong withdrawal password.</span>';render();return}
   S.wd.push({id:uid('w'),by:user.name,kind:f.t,to:f.m,name:f.n,num:digits,amount:amt,date:today()});save();wf=null;
   msg='Withdrawal of '+peso(amt)+' to '+esc(f.m)+' recorded. Send the money from the clinic account yourself. This system keeps the record and the balance.';render()})}
 else if(t.dataset.dact){const x=S.don.find(y=>y.id===t.dataset.did);if(x&&x.status==='Pending'){x.status=t.dataset.dact==='ok'?'Received':'Rejected';save();msg=x.status==='Received'?peso(x.amount)+' added to the clinic balance.':'Donation rejected.'}render()}
 else if(t.id==='paysave'){S.pay={GCash:{name:$('#g1').value.trim(),num:$('#g2').value.trim()},Maya:{name:$('#m1').value.trim(),num:$('#m2').value.trim()},'Online banking':{bank:$('#b0').value.trim(),name:$('#b1').value.trim(),num:$('#b2').value.trim()}};save();msg='Receiving accounts saved.';render()}
 else if(t.id==='dsend'){const m=$('#dm').value,a=+$('#da').value,r=$('#dr').value.trim(),d=$('#dd').value.trim();
  if(!(a>0)||a>1000000||r.length<4){dn={m,a:$('#da').value,r,d};msg='<span class="err">Enter an amount and the reference number from your receipt.</span>';render();return}
  S.don.push({id:uid('n'),u:user.u,name:user.name,m,amount:a,ref:r,note:d,date:today(),status:'Pending'});save();dn=null;msg='Thank you! Your donation was sent to the clinic staff to check. It shows as Received once they confirm it.';render()}
 else if(t.id==='tadd'){const n=$('#tn').value.trim(),r=$('#tr').value,u=$('#tu').value.trim(),pw=$('#tp').value,sp=$('#ts').value.trim(),days=[0,1,2,3,4,5,6].filter(i=>$('#td'+i).checked);
  const bad=!n||!u?'Enter a name and a username.':pw.length<6?'Password must have at least 6 characters.':[...ACC,...getAcc()].some(x=>x.u.toLowerCase()===u.toLowerCase())?'That username is taken.':r!=='staff'&&!days.length?'Choose at least one working day.':'';
  if(bad){msg=bad;render();return}
  const acc=getAcc(),a={u,p:pw,role:r==='staff'?'staff':'doctor',name:n};
  if(r!=='staff'){const d={id:uid('d'),name:n,spec:sp||(r==='Midwife'?'Maternal and Newborn Care':'General Medicine'),days,kind:r};S.doctors.push(d);a.did=d.id}
  acc.push(a);try{localStorage.setItem('clinic-acc',JSON.stringify(acc))}catch(err){}save();msg='Added '+esc(n)+' ('+(r==='staff'?'front desk staff':r.toLowerCase())+'). They can now log in as '+esc(u)+'.';render()}
 else if(t.id==='rsend'){const n=$('#qn').value.trim(),av=$('#qa').value,g=$('#qg').value,r=$('#qr').value.trim();
  if(!n||av===''||+av<0||+av>120||!g||!r){rq={n,a:av,g,r};msg='Please fill in your name, age, gender and reason for visit.';render();return}
  const p=S.patients.find(x=>x.id===myPid());Object.assign(p,{name:n,age:+av,gender:g});
  S.appts.push({id:uid('a'),pid:p.id,did:null,date:'',time:'',reason:r,status:'Pending'});save();rq=null;
  msg='Request sent. Clinic staff will confirm your appointment and choose the date and time based on the doctors on duty.';tab='mine';render()}});
v.addEventListener('change',e=>{if(!arr)return;if(e.target.id==='ad'){arr.date=e.target.value||arr.date;arr.slot='';render()}else if(e.target.id==='adoc'){arr.did=e.target.value;arr.slot='';render()}});
v.addEventListener('click',e=>{if(e.target.id==='toReg'){authMode='register';msg='';render()}if(e.target.id==='toLogin'){authMode='login';msg='';render()}});
v.addEventListener('submit',e=>{if(e.target.id!=='rf')return;e.preventDefault();const n=$('#rn2').value.trim(),u=$('#ru').value.trim(),p1=$('#rp1').value;
 const bad=!n||!u?'Enter your name and a username.':p1.length<6?'Password must have at least 6 characters.':p1!==$('#rp2').value?'Passwords do not match.':[...ACC,...getAcc()].some(x=>x.u.toLowerCase()===u.toLowerCase())?'That username is taken. Choose another.':'';
 if(bad){msg=bad;render();return}
 const acc=getAcc(),a={u,p:p1,role:'patient',name:n};acc.push(a);try{localStorage.setItem('clinic-acc',JSON.stringify(acc))}catch(err){}
 msg='';user={...a,p:undefined};try{sessionStorage.setItem('clinic-user',JSON.stringify(user))}catch(err){}authMode='login';tab='duty';render()});
v.addEventListener('submit',e=>{if(e.target.id!=='lf')return;e.preventDefault();const a=[...ACC,...getAcc()].find(x=>x.u===$('#lu').value.trim()&&x.p===$('#lp').value);if(!a){msg='Wrong username or password. Check both and try again.';render();return}msg='';user={...a,p:undefined};try{sessionStorage.setItem('clinic-user',JSON.stringify(user))}catch(err){}tab='dash';render()});
$('#out').onclick=()=>{user=null;msg='';try{sessionStorage.removeItem('clinic-user')}catch(e){}render()};
v.addEventListener('click',e=>{if(e.target.id==='pr')window.print()});
v.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.slot){draft.time=d.slot;render()}
 else if(d.f){filter=d.f;render()}
 else if(d.p){selP=d.p;render()}
 else if(d.act){const a=S.appts.find(x=>x.id===d.id);a.status=d.act==='done'?'Completed':d.act==='confirm'?'Scheduled':'Cancelled';save();render()}
 else if(t.id==='bsave'){
  let pid=draft.pid;if(role()==='patient')pid=myPid();
  if(pid==='new'){const n=$('#nn').value.trim();if(!n){msg='<span class="err">Enter the new patient\u2019s name.</span>';render();return}
   const p={id:uid('p'),name:n,age:+$('#na').value||0,phone:$('#np').value.trim(),notes:[]};S.patients.push(p);pid=p.id;draft.pid=pid}
  if(!draft.time){msg='<span class="err">Choose a time slot first.</span>';render();return}
  if(taken(draft.did,draft.date,draft.time)){msg='<span class="err">That slot was just taken. Choose another time.</span>';draft.time='';render();return}
  S.appts.push({id:uid('a'),pid,did:draft.did,date:draft.date,time:draft.time,reason:$('#br').value.trim(),status:'Scheduled'});save();
  msg=`Booked: ${esc(P(pid).name)} with ${esc(D(draft.did).name)} on ${fdate(draft.date)} at ${fmt(draft.time)}.`;draft.time='';render()}
 else if(t.id==='radd'){const n=$('#rn').value.trim();if(!n)return;const p={id:uid('p'),name:n,age:+$('#ra').value||0,phone:$('#rp').value.trim(),notes:[]};S.patients.push(p);selP=p.id;save();render()}
 else if(t.id==='nadd'){const x=$('#nt').value.trim();if(!x)return;P(selP).notes.push({date:today(),did:$('#nd').value,text:x});save();render()}
});
v.addEventListener('change',e=>{const i=e.target.id;
 if(i==='bp'){draft.pid=e.target.value;render()}
 else if(i==='bd'){draft.did=e.target.value;draft.time='';render()}
 else if(i==='bdt'){draft.date=e.target.value||addDays(1);draft.time='';render()}});
v.addEventListener('input',e=>{if(e.target.id==='sq'){q=e.target.value;const pos=e.target.selectionStart;render();const s=$('#sq');s.focus();s.setSelectionRange(pos,pos)}});
render();
</script>
